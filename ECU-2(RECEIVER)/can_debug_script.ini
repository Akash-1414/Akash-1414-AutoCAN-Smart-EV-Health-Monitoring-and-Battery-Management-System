

DEFINE BUTTON "SW-DATAFRAME","sendmessage(1)"

DEFINE BUTTON "SW-REMOTEFRAME","sendmessage(2)"


func void sendmessage(unsigned char i)

{

	switch(i)

	{

		case 1 : CAN2ID=0x001;

				 CAN2L=4;

				 CAN2B0=0x00011110;

				 CAN2B1=0x00;

				 CAN2B2=0x00;

				 CAN2B3=0x00;

				 CAN2IN=1;

				 break;


		case 2 : CAN2ID=0x002;

				 CAN2L=7;

				 CAN2IN=3;

				 break;

	}

}
